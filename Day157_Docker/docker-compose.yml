services:
  server:
    build: ./server
    ports:
      - "3000:3000"
    volumes:
      - ./server:/app/server
      - backend_node_modules:/app/server/node_modules
    command: npx nodemon -L server.js
      
  client:
    build: ./client
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app/client
      - frontend_node_modules:/app/client/node_modules
    command: npm run dev
    
volumes:
  frontend_node_modules:
  backend_node_modules:
