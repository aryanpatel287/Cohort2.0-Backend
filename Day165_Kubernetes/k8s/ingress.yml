apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: k8s-backend-ingress
  labels:
    app.kubernetes.io/name: k8s-backend-ingress
spec:
  ingressClassName: nginx
  rules:
  -  http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: main-server-service
            port: 
              number: 80
  - http:
      paths:
        - pathType: Prefix
          path: "/api/products"
          backend:
            service:
              name: product-server-service
              port: 
                number: 80